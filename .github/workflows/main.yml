name: Deploy Chulbul Design to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      blog_bundle:
        description: 'Optional reviewed four-article bundle filename to publish after deployment'
        required: false
        default: ''
        type: string

concurrency:
  group: chulbul-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21

          local-dir: ./
          server-dir: ./

          dangerous-clean-slate: false

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
            **/.env
            **/.env.*
            **/error_log
            **/*.sql
            **/*.zip
            **/*.log
            **/.ftp-deploy-sync-state.json
            **/.ftpquota
            scripts/deploy-blog-bundle.py
            README.md

      - name: Publish reviewed blog bundle
        if: github.event_name == 'workflow_dispatch' && inputs.blog_bundle != ''
        env:
          BLOG_BUNDLE: ${{ inputs.blog_bundle }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-blog-bundle.py
